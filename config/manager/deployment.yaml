apiVersion: v1
kind: Namespace
metadata:
  name: watcher-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher-controller
  namespace: watcher-system
  labels:
    app: watcher-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: watcher-controller
  template:
    metadata:
      labels:
        app: watcher-controller
    spec:
      serviceAccountName: watcher-controller
      containers:
      - name: watcher
        image: watcher:latest
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect=true
        - --leader-election-id=watcher-controller
        - --metrics-bind-address=:9090
        - --health-probe-bind-address=:8081
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LOG_LEVEL
          value: "info"
        # Airflow pool-scaler settings (optional -- omit to disable Pool controller)
        # - name: AIRFLOW_HOST
        #   valueFrom:
        #     secretKeyRef:
        #       name: airflow-credentials
        #       key: AIRFLOW_HOST
        # - name: AIRFLOW_USERNAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: airflow-credentials
        #       key: AIRFLOW_USERNAME
        # - name: AIRFLOW_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: airflow-credentials
        #       key: AIRFLOW_PASSWORD
        # - name: DRY_RUN
        #   value: "false"
        ports:
        - containerPort: 9090
          name: metrics
        - containerPort: 8081
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault