apiVersion: v1
kind: Namespace
metadata:
  name: watcher-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher-controller
  namespace: watcher-system
  labels:
    app: watcher-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: watcher-controller
  template:
    metadata:
      labels:
        app: watcher-controller
    spec:
      serviceAccountName: watcher-controller
      containers:
      - name: manager
        image: watcher:latest
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect=true
        - --leader-election-id=watcher-controller
        - --metrics-bind-address=:9090  # Change port here
        - --health-probe-bind-address=:8081
        env:
        - name: LOG_LEVEL
          value: "info"  # Options: debug, info, error
        ports:
        - containerPort: 9090
          name: metrics
        - containerPort: 8081
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault