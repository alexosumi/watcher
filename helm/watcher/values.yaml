replicaCount: 2

image:
  repository: ghcr.io/alexosumi/watcher
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "watcher-controller"

leaderElection:
  enabled: true
  id: "watcher-controller"

metrics:
  port: 9090

health:
  port: 8081

logLevel: "info"

concurrency:
  watcher: 5
  pool: 5
  airflowClear: 3
  sparkApplicationClear: 3

airflow:
  enabled: false
  # Pass credentials directly (chart creates the Secret for you):
  host: ""
  username: ""
  password: ""
  # Or reference a pre-existing Secret (takes precedence over host/username/password):
  existingSecret: ""
  dryRun: "false"

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}
