apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: watchers.watcher.io
  annotations:
    "watcher.io/minimum-k8s-version": "1.33.0"
spec:
  group: watcher.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - namespace
            properties:
              namespace:
                type: string
                description: "Namespace to monitor pods in"
              labelSelector:
                type: object
                additionalProperties:
                  type: string
                description: "Label selector to filter pods for monitoring"
              memoryThreshold:
                type: integer
                minimum: 1
                maximum: 100
                default: 80
                description: "Memory threshold percentage (0-100) when to trigger scaling"
              scaleUpPercentage:
                type: integer
                minimum: 1
                maximum: 200
                default: 50
                description: "How much to increase memory (default 50%)"
              mode:
                type: string
                enum:
                - watch
                - patch
                default: patch
                description: "Operation mode: watch (log recommendations) or patch (apply changes)"
          status:
            type: object
            properties:
              monitoredPods:
                type: integer
                description: "Number of pods currently being monitored"
              lastScaleTime:
                type: string
                format: date-time
                description: "When the last scaling operation occurred"
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: watchers
    singular: watcher
    kind: Watcher
