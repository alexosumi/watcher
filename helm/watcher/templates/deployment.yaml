apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "watcher.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "watcher.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "watcher.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: watcher
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --leader-elect={{ .Values.leaderElection.enabled }}
        {{- if .Values.leaderElection.enabled }}
        - --leader-election-id={{ .Values.leaderElection.id }}
        {{- end }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        - --health-probe-bind-address=:{{ .Values.health.port }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LOG_LEVEL
          value: {{ .Values.logLevel | quote }}
        {{- if .Values.airflow.enabled }}
        {{- $secretName := .Values.airflow.existingSecret | default (printf "%s-airflow" (include "watcher.fullname" .)) }}
        - name: AIRFLOW_HOST
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: AIRFLOW_HOST
        - name: AIRFLOW_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: AIRFLOW_USERNAME
        - name: AIRFLOW_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: AIRFLOW_PASSWORD
        - name: DRY_RUN
          value: {{ .Values.airflow.dryRun | default "false" | quote }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
        - containerPort: {{ .Values.health.port }}
          name: health
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
