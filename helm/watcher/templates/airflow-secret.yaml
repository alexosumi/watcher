{{- if and .Values.airflow.enabled (not .Values.airflow.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "watcher.fullname" . }}-airflow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIRFLOW_HOST: {{ required "airflow.host is required when airflow.enabled=true and no existingSecret" .Values.airflow.host | quote }}
  AIRFLOW_USERNAME: {{ required "airflow.username is required when airflow.enabled=true and no existingSecret" .Values.airflow.username | quote }}
  AIRFLOW_PASSWORD: {{ required "airflow.password is required when airflow.enabled=true and no existingSecret" .Values.airflow.password | quote }}
{{- end }}
