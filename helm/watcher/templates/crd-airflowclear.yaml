apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: airflowclears.watcher.io
spec:
  group: watcher.io
  names:
    kind: AirflowClear
    listKind: AirflowClearList
    plural: airflowclears
    shortNames:
    - aclear
    singular: airflowclear
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: AirflowClear clears old Airflow DAG runs based on age.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: AirflowClearSpec defines the desired state of AirflowClear.
            type: object
            required:
            - olderThanDays
            properties:
              dagId:
                description: DagID is the Airflow DAG ID to target. If empty, all DAGs are scanned.
                type: string
              olderThanDays:
                description: OlderThanDays is the age threshold in days. DAG runs older than this will be cleared.
                type: integer
                format: int32
                minimum: 1
              mode:
                description: "Operation mode: watch (log what would be deleted) or patch (delete old runs)."
                type: string
                enum:
                - watch
                - patch
                default: watch
              reconcileIntervalSeconds:
                description: ReconcileIntervalSeconds controls how often this AirflowClear is reconciled.
                type: integer
                format: int32
                minimum: 5
                default: 300
          status:
            description: AirflowClearStatus defines the observed state of AirflowClear.
            type: object
            properties:
              deletedRuns:
                description: DeletedRuns is the count of DAG runs deleted (or that would be deleted in watch mode) in the last reconcile.
                type: integer
                format: int32
              processedDags:
                description: ProcessedDags is the number of DAGs scanned in the last reconcile.
                type: integer
                format: int32
              lastCleanupTime:
                description: LastCleanupTime is the timestamp of the last reconcile cleanup.
                type: string
                format: date-time
              lastAction:
                description: LastAction is a human-readable description of the last reconcile action.
                type: string
              conditions:
                description: Conditions represent the latest available observations of the AirflowClear's state.
                type: array
                items:
                  type: object
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
    subresources:
      status: {}
